name: ImageBatch iOS
on:
  push:
    branches: [main]
    paths: ['apps/ImageBatch/**', '.github/workflows/image-batch-ios.yml']
  pull_request:
    paths: ['apps/ImageBatch/**', '.github/workflows/image-batch-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imagebatch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test import, task updates and streaming ZIP
        working-directory: apps/ImageBatch/Core
        run: swift test
      - name: Generate Xcode project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        working-directory: apps/ImageBatch
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build for iPhone without signing
        working-directory: apps/ImageBatch
        run: xcodebuild -project ImageBatch.xcodeproj -scheme ImageBatch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for personal signing
        working-directory: apps/ImageBatch
        run: |
          mkdir -p Package/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/ImageBatch.app Package/Payload/ImageBatch.app
          cd Package
          zip -qry ../ImageBatch-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ImageBatch-unsigned-ipa
          path: apps/ImageBatch/ImageBatch-unsigned.ipa
          retention-days: 14
      - name: Select an available iPhone simulator
        run: |
          destination_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "IMAGEBATCH_SIMULATOR=$destination_id" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$destination_id" || true
          xcrun simctl bootstatus "$destination_id" -b
      - name: Test import screen on iOS simulator
        working-directory: apps/ImageBatch
        timeout-minutes: 15
        run: xcodebuild -project ImageBatch.xcodeproj -scheme ImageBatch -configuration Debug -destination "platform=iOS Simulator,id=$IMAGEBATCH_SIMULATOR" -parallel-testing-enabled NO -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult CODE_SIGN_IDENTITY=- test
      - name: Export simulator screenshots
        if: always()
        working-directory: apps/ImageBatch
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path Screenshots
          fi
      - name: Capture test download failures
        if: always()
        run: |
          xcrun simctl list devices booted -j | python3 -c 'import json,sys; print("\n".join(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds))' | while read -r device_id; do
            container_path=$(xcrun simctl get_app_container "$device_id" com.polishwb1020.imagebatch data 2>/dev/null) || continue
            task_file="$container_path/Library/Application Support/ImageBatch/tasks.json"
            if [ -f "$task_file" ]; then
              python3 -c 'import json,sys; print(json.dumps([{ "name": b["name"], "items": [{"state":i["state"], "error":i.get("error")} for i in b["items"]]} for b in json.load(open(sys.argv[1]))],ensure_ascii=False))' "$task_file"
            fi
          done
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImageBatch-screenshots
          path: apps/ImageBatch/Screenshots
          retention-days: 14
      - name: Package simulator app
        working-directory: apps/ImageBatch
        run: tar -czf ImageBatch-simulator.tar.gz -C DerivedData/Build/Products/Debug-iphonesimulator ImageBatch.app
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ImageBatch-simulator
          path: apps/ImageBatch/ImageBatch-simulator.tar.gz
          retention-days: 14
      - name: Upload project and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImageBatch-project-and-tests
          path: |
            apps/ImageBatch/ImageBatch.xcodeproj
            apps/ImageBatch/Generated/Info.plist
          retention-days: 14
      - name: Upload detailed failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ImageBatch-failed-test-results
          path: apps/ImageBatch/TestResults.xcresult
          retention-days: 3
