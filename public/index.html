<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="浏览、搜索和阅读图集，收藏喜欢的作品。">
  <meta name="referrer" content="no-referrer">
  <title>衣境 · Gallery Reader</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#discover"><span class="brand-icon">衣</span><span>衣境<small>GALLERY READER</small></span></a>
    <div class="side-caption">我的阅读空间</div>
    <nav id="desktop-nav" aria-label="主导航"></nav>
    <div class="sidebar-bottom"><span class="status-dot"></span> 实时图集阅读<p>把喜欢的角色，留在这一页。</p><button class="text-button" data-action="settings">阅读偏好 <span>↗</span></button></div>
  </aside>
  <div class="shell">
    <header class="topbar"><a class="mobile-brand" href="#discover">衣境<span> / GALLERY</span></a><span class="breadcrumb">在线图集 / <b id="breadcrumb">发现</b></span><div class="top-actions"><span id="network" class="connection">实时图集</span><button class="icon-button" data-feature="search" aria-label="搜索图集"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 21l-5-5M18 10.5a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z"/></svg></button><button class="icon-button" data-action="settings" data-icon="settings" aria-label="打开阅读偏好"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18.93 9.13L21.29 10.02L21.29 13.98L18.93 14.87L19.97 17.17L17.17 19.97L14.87 18.93L13.98 21.29L10.02 21.29L9.13 18.93L6.83 19.97L4.03 17.17L5.07 14.87L2.71 13.98L2.71 10.02L5.07 9.13L4.03 6.83L6.83 4.03L9.13 5.07L10.02 2.71L13.98 2.71L14.87 5.07L17.17 4.03L19.97 6.83L18.93 9.13zM15 12a3 3 0 1 1-6 0a3 3 0 0 1 6 0z"/></svg></button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>衣境 · 让阅读回归图像</span></footer>
  </div>
  <!-- Compatibility for cached versions that still update the former theme control. -->
  <span data-action="theme" hidden aria-hidden="true"></span>
  <nav class="bottom-nav" id="mobile-nav" aria-label="移动主导航"></nav>
  <dialog id="detail-dialog" class="detail-dialog"><div id="detail-body"></div></dialog>
  <dialog id="settings-dialog" class="settings-dialog">
    <div class="dialog-header"><h2>阅读偏好</h2><button class="icon-button" data-action="close-settings" aria-label="关闭">✕</button></div>
    <fieldset class="category-settings">
      <legend>全局筛选分类</legend>
      <p class="setting-help">选择要显示的分类，可多选。</p>
      <div class="category-controls"><button class="text-button" data-action="select-all-categories">全选</button><button class="text-button" data-action="clear-categories">清空</button></div>
      <div id="category-options" class="category-options"></div>
      <div class="category-apply"><span id="category-count" role="status"></span><button class="primary-button" data-action="apply-categories">应用分类</button></div>
    </fieldset>
    <label class="setting-row">界面主题<select id="theme-setting"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></label>
    <section class="image-cache-settings" aria-labelledby="image-cache-title"><h3 id="image-cache-title">本地图片缓存</h3><p class="setting-help">缓存已查看的图片，加快再次打开。</p><div class="source-actions"><div class="cache-statistics" role="status"><span id="image-cache-count">正在统计…</span><span id="image-cache-usage">正在统计占用空间…</span></div><button class="outline-button" data-action="clear-image-cache">清除图片缓存</button></div></section>
    <button class="danger-button" data-action="clear-history">清除本机阅读记录</button>
    <section class="source-settings" aria-labelledby="source-settings-title">
      <h3 id="source-settings-title">内容源与凭证</h3>
      <label class="setting-row source-select">当前内容源<select id="source-setting"><option value="e-hentai">E-Hentai</option><option value="exhentai" disabled>ExHentai（需要凭证）</option></select></label>
      <p class="setting-help">填写并验证后可切换至 ExHentai。凭证保存在当前浏览器，可随时更新或清除。</p>
      <form id="ex-credentials-form" autocomplete="off">
        <label class="credential-field">ipb_member_id<input name="ipb_member_id" type="password" autocomplete="off" required></label>
        <label class="credential-field">ipb_pass_hash<input name="ipb_pass_hash" type="password" autocomplete="off" required></label>
        <label class="credential-field">ipb_session_id<input name="ipb_session_id" type="password" autocomplete="off" required></label>
        <label class="credential-field">igneous <small>选填，可自动更新</small><input name="igneous" type="password" autocomplete="off"></label>
        <div class="source-actions"><button type="submit" class="primary-button" id="verify-ex">验证并保存到本机</button><button type="button" class="outline-button" data-action="clear-ex-session">清除凭证</button></div>
      </form>
      <p id="ex-session-status" class="setting-help" role="status">输入凭证后验证。</p>
    </section>
  </dialog>
  <section id="reader" class="reader" hidden aria-label="图集阅读器">
    <header class="reader-top"><button class="icon-button" data-action="exit-reader" aria-label="退出阅读">←</button><div><b id="reader-title"></b><small id="reader-source"></small></div><button class="icon-button" data-action="reader-mode" aria-label="切换阅读方式">▤</button><button class="icon-button" data-action="reader-favorite" aria-label="收藏图集" id="reader-favorite">♡</button></header>
    <div id="reader-content" class="reader-content"></div>
    <footer class="reader-bottom"><button class="icon-button" data-action="prev" aria-label="上一页">←</button><input id="page-slider" type="range" min="1" max="1" value="1" aria-label="跳转页码"><span id="page-counter"></span><button class="icon-button" data-action="next" aria-label="下一页">→</button></footer>
  </section>
  <div id="toast" role="status" class="toast" popover="manual" hidden></div>
  <section id="photo-viewer" class="photo-viewer" hidden aria-label="照片预览"></section>
</body>
</html>
