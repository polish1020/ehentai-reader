<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="非色情 Cosplay 精选图集阅读器。收藏、进度同步到本机，支持离线应用和沉浸阅读。">
  <meta name="referrer" content="no-referrer">
  <title>衣境 · Cosplay Reader</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#discover"><span class="brand-icon">衣</span><span>衣境<small>COSPLAY READER</small></span></a>
    <div class="side-caption">我的阅读空间</div>
    <nav id="desktop-nav" aria-label="主导航"></nav>
    <div class="sidebar-bottom"><span class="status-dot"></span> 非色情 Cosplay 专区<p>把喜欢的角色，留在这一页。</p><button class="text-button" data-action="settings">阅读偏好 <span>↗</span></button></div>
  </aside>
  <div class="shell">
    <header class="topbar"><a class="mobile-brand" href="#discover">衣境<span> / COSPLAY</span></a><span class="breadcrumb">个人图集 / <b id="breadcrumb">发现</b></span><div class="top-actions"><span id="network" class="connection">本机阅读空间</span><button class="icon-button" data-action="theme" aria-label="切换深色模式">◐</button><button class="avatar" data-action="settings" aria-label="打开阅读偏好">W</button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>衣境 · 让阅读回归图像</span><span>仅展示审核通过的非色情 Cosplay</span></footer>
  </div>
  <nav class="bottom-nav" id="mobile-nav" aria-label="移动主导航"></nav>
  <dialog id="detail-dialog" class="detail-dialog"><div id="detail-body"></div></dialog>
  <dialog id="settings-dialog" class="settings-dialog">
    <div class="dialog-header"><h2>阅读偏好</h2><button class="icon-button" data-action="close-settings" aria-label="关闭">✕</button></div>
    <label class="setting-row">默认阅读方式<select id="mode-setting"><option value="paged">逐页翻阅</option><option value="scroll">纵向滚动</option></select></label>
    <label class="setting-row">翻页方向<select id="direction-setting"><option value="ltr">从左到右</option><option value="rtl">从右到左</option></select></label>
    <label class="setting-row">界面主题<select id="theme-setting"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></label>
    <div class="settings-note"><b>在 iPhone 上使用</b><p>用 Safari 打开，点击分享按钮 →「添加到主屏幕」，即可全屏使用。收藏与进度保存在当前浏览器，不会跨设备同步。</p><b>关于内容源</b><p id="source-info">正在读取内容目录…</p><p>交互参考 EhPanda 与 JHentai，独立实现，未复制其源代码或素材。</p></div>
    <button class="danger-button" data-action="clear-history">清除本机阅读记录</button>
  </dialog>
  <section id="reader" class="reader" hidden aria-label="图集阅读器">
    <header class="reader-top"><button class="icon-button" data-action="exit-reader" aria-label="退出阅读">←</button><div><b id="reader-title"></b><small id="reader-source"></small></div><button class="icon-button" data-action="reader-mode" aria-label="切换阅读方式">▤</button><button class="icon-button" data-action="reader-favorite" aria-label="收藏图集" id="reader-favorite">♡</button></header>
    <div id="reader-content" class="reader-content"></div>
    <footer class="reader-bottom"><button class="icon-button" data-action="prev" aria-label="上一页">←</button><input id="page-slider" type="range" min="1" max="1" value="1" aria-label="跳转页码"><span id="page-counter"></span><button class="icon-button" data-action="next" aria-label="下一页">→</button></footer>
  </section>
  <div id="toast" role="status" class="toast" hidden></div>
</body>
</html>
