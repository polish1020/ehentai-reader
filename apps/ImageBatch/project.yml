name: ImageBatch
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  ImageBatch:
    type: application
    platform: iOS
    sources:
      - App
      - Core/Sources/ImageBatchCore
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polishwb1020.imagebatch
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 拾图
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleDocumentTypes:
          - CFBundleTypeName: 图片下载清单
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.plain-text]
  ImageBatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ImageBatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polishwb1020.imagebatch.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ImageBatch
  ImageBatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ImageBatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polishwb1020.imagebatch.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ImageBatch:
    build:
      targets:
        ImageBatch: all
        ImageBatchUITests: [test]
        ImageBatchTests: [test]
    test:
      targets: [ImageBatchTests, ImageBatchUITests]
